  or any other API artifact could be located, so no provider artifacts were generated or derived. The
  2026-07-20 pass re-verified this independently: dija.co and dija.com return NXDOMAIN, dija.co.uk resolves
  to an Aftermarket.com parking page advertising the domain for sale (Nominet registration active to
  2026-12-10) and returns 404 for every /.well-known/ discovery path and /llms.txt. Note for future runs:
  the github.com/dija organization and the dija.now and dija.sa domains are UNRELATED name collisions
  (Dija, a Saudi Arabia software firm, and a separate reminder app) and must not be attributed to this
  company. This profile remains a lead with no active public API surface.'
